<!-- Global Header Navigation (shown on all pages except login) -->
<app-header
  *ngIf="shouldShowHeader()"
  [activeNavLink]="getActiveNavLink()"
  [showSearch]="true"
  [showNotifications]="true">
</app-header>

<!-- Theme Customizer (shown on all pages except login) -->
<app-theme-customizer *ngIf="!isLoginPage()"></app-theme-customizer>

<router-outlet />
