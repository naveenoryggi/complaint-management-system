<!-- FAB Button -->
<button class="chat-fab" (click)="toggle()" matTooltip="AI Tender Assistant">
  <mat-icon>{{ isOpen() ? 'close' : 'chat' }}</mat-icon>
</button>

<!-- Chat Panel -->
@if (isOpen()) {
  <div class="chat-panel">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-title">
        <mat-icon>smart_toy</mat-icon>
        <span>AI Tender Assistant</span>
      </div>
      <div class="header-actions">
        <button mat-icon-button matTooltip="Clear chat" (click)="clearChat()" class="header-btn">
          <mat-icon>delete_sweep</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Minimize" (click)="toggle()" class="header-btn">
          <mat-icon>minimize</mat-icon>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #messageList>
      @if (loading()) {
        <div class="loading-messages">
          <mat-spinner diameter="28"></mat-spinner>
        </div>
      } @else if (messages().length === 0) {
        <div class="empty-chat">
          <mat-icon>forum</mat-icon>
          <p>Ask me anything about this tender!</p>
          <div class="suggestion-chips">
            <button class="suggestion" (click)="messageText = 'What is the deadline?'; sendMessage()">
              What is the deadline?
            </button>
            <button class="suggestion" (click)="messageText = 'What documents are missing?'; sendMessage()">
              Missing documents?
            </button>
            <button class="suggestion" (click)="messageText = 'Am I eligible for this tender?'; sendMessage()">
              Eligibility check
            </button>
          </div>
        </div>
      } @else {
        @for (msg of messages(); track msg.id) {
          <div class="message" [class.user-message]="msg.role === 'user'" [class.assistant-message]="msg.role === 'assistant'">
            <div class="message-bubble">
              <div class="message-content">{{ msg.content }}</div>
              <div class="message-time">{{ formatTime(msg.created_at) }}</div>
            </div>
          </div>
        }
        @if (sending()) {
          <div class="message assistant-message">
            <div class="message-bubble typing">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
          </div>
        }
      }
    </div>

    <!-- Input -->
    <div class="chat-input">
      <textarea
        [(ngModel)]="messageText"
        (keydown)="onKeydown($event)"
        placeholder="Type a message..."
        rows="1"
        [disabled]="sending()"
        class="input-field"
      ></textarea>
      <button mat-icon-button color="primary" (click)="sendMessage()"
              [disabled]="!messageText.trim() || sending()" class="send-btn">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
}
