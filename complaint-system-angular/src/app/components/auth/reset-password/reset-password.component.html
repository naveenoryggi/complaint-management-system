<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="card-header">
      <h2>Reset Password</h2>
      <p *ngIf="userEmail">for {{ userEmail }}</p>
    </div>

    <div class="card-body">
      <!-- Validating Token Spinner -->
      <div *ngIf="validatingToken" class="text-center">
        <div class="spinner-large"></div>
        <p>Validating your reset link...</p>
      </div>

      <!-- Invalid Token Message -->
      <div *ngIf="!validatingToken && !tokenValid">
        <div class="alert alert-error">
          {{ message }}
        </div>
        <button type="button" class="btn btn-primary" (click)="requestNewResetLink()">
          Request New Reset Link
        </button>
        <div class="text-center mt-3">
          <a routerLink="/login" class="link">Back to Login</a>
        </div>
      </div>

      <!-- Valid Token - Show Form -->
      <div *ngIf="!validatingToken && tokenValid">
        <!-- Success/Error Message -->
        <div *ngIf="message" class="alert" [ngClass]="{'alert-success': !isError, 'alert-error': isError}">
          {{ message }}
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <!-- New Password Field -->
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-input-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="newPassword"
                formControlName="newPassword"
                class="form-control"
                [ngClass]="{'is-invalid': submitted && f['newPassword'].errors}"
                placeholder="Enter your new password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                <span *ngIf="!showPassword">👁️</span>
                <span *ngIf="showPassword">👁️‍🗨️</span>
              </button>
            </div>
            <div *ngIf="submitted && f['newPassword'].errors" class="invalid-feedback">
              <span *ngIf="f['newPassword'].errors['required']">Password is required</span>
              <span *ngIf="f['newPassword'].errors['minlength']">
                Password must be at least 8 characters
              </span>
            </div>

            <!-- Password Strength Meter -->
            <app-password-strength-meter
              [password]="resetPasswordForm.value.newPassword"
              [showLabel]="true"
            ></app-password-strength-meter>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-input-wrapper">
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                id="confirmPassword"
                formControlName="confirmPassword"
                class="form-control"
                [ngClass]="{'is-invalid': submitted && f['confirmPassword'].errors}"
                placeholder="Confirm your new password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="toggleConfirmPasswordVisibility()"
                [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
              >
                <span *ngIf="!showConfirmPassword">👁️</span>
                <span *ngIf="showConfirmPassword">👁️‍🗨️</span>
              </button>
            </div>
            <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
              <span *ngIf="f['confirmPassword'].errors['required']">
                Please confirm your password
              </span>
              <span *ngIf="f['confirmPassword'].errors['passwordMismatch']">
                Passwords do not match
              </span>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span *ngIf="!loading">Reset Password</span>
            <span *ngIf="loading">
              <span class="spinner"></span>
              Resetting Password...
            </span>
          </button>

          <!-- Back to Login -->
          <div class="text-center mt-3">
            <a routerLink="/login" class="link">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
