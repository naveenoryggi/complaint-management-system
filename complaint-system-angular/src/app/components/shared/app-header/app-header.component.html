<header class="main-header">
  <div class="header-container">
    <div class="header-left">
      <div class="logo-section" (click)="goHome()">
        <div class="logo-icon">
          <img *ngIf="companyLogoUrl" [src]="companyLogoUrl" [alt]="company?.name || 'Company Logo'" class="company-logo">
          <svg *ngIf="!companyLogoUrl" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
          </svg>
        </div>
        <h2 class="company-name">{{ company?.name || 'OryggiTech' }}</h2>
      </div>
      <nav class="main-nav">
        <a class="nav-link" [class.active]="activeNavLink === 'dashboard'" (click)="navigateToPage('/dashboard')">Dashboard</a>
        <a class="nav-link" [class.active]="activeNavLink === 'complaints'" (click)="navigateToPage('/complaints')">All Complaints</a>
        <a class="nav-link" [class.active]="activeNavLink === 'reports'" (click)="navigateToPage('/reports')" *ngIf="isAdmin()">Reports</a>
        <div class="nav-dropdown" *ngIf="isAdmin() && showAdminPanel">
          <button class="nav-link dropdown-trigger" (click)="toggleAdminMenu(); $event.stopPropagation()">
            <span>Admin Panel</span>
            <i class="fa-solid" [ngClass]="showAdminMenu ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </button>
          <div class="dropdown-menu" *ngIf="showAdminMenu" (click)="$event.stopPropagation()">
            <div class="menu-category" *ngFor="let category of menuCategories">
              <div class="category-header" (click)="toggleMenuCategory(category.id)">
                <div class="category-title">
                  <i class="fa-solid" [ngClass]="category.icon" [style.color]="category.color"></i>
                  <span>{{ category.label }}</span>
                </div>
                <i class="fa-solid" [ngClass]="category.expanded ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
              </div>
              <div class="category-items" *ngIf="category.expanded">
                <a class="menu-item" *ngFor="let item of category.items" (click)="navigateToAdmin(item.route)">
                  <i class="fa-solid" [ngClass]="item.icon"></i>
                  <span>{{ item.label }}</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </div>
    <div class="header-right">
      <div class="search-box" *ngIf="showSearch">
        <i class="fa-solid fa-search"></i>
        <input type="search" placeholder="Search..." [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
      </div>
      <button class="notification-btn" *ngIf="showNotifications" (click)="onNotificationClick()">
        <i class="fa-regular fa-bell"></i>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount > 99 ? '99+' : notificationCount }}</span>
      </button>
      <div class="user-avatar-dropdown">
        <div class="avatar" (click)="toggleUserMenu(); $event.stopPropagation()">
          <i class="fa-regular fa-circle-user"></i>
        </div>
        <div class="user-menu" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
          <div class="user-info">
            <span class="user-name">{{ currentUser?.fullName }}</span>
            <span class="user-role">{{ getRoleNames() }}</span>
          </div>
          <div class="menu-divider"></div>
          <a class="menu-item" (click)="navigateToPage('/dashboard')">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
          </a>
          <a class="menu-item" (click)="navigateToPage('/change-password')">
            <i class="fa-solid fa-key"></i>
            <span>Change Password</span>
          </a>
          <div class="menu-divider"></div>
          <a class="menu-item logout" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
