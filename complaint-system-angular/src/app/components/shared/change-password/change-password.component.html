<div class="change-password-container">
  <div class="change-password-card">
    <div class="card-header">
      <h2 class="card-title">Change Password</h2>
      <p class="card-description">Update your password to keep your account secure</p>
    </div>

    <div class="card-body">
      <!-- Success Message -->
      <div class="alert alert-success" *ngIf="successMessage">
        <svg class="alert-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error Message -->
      <div class="alert alert-error" *ngIf="errorMessage">
        <svg class="alert-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        <!-- Current Password -->
        <div class="form-group">
          <label for="currentPassword" class="form-label">
            Current Password
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              id="currentPassword"
              [type]="showCurrentPassword ? 'text' : 'password'"
              formControlName="currentPassword"
              class="form-control"
              [class.invalid]="isFieldInvalid('currentPassword')"
              placeholder="Enter your current password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password-btn"
              (click)="togglePasswordVisibility('current')"
              [attr.aria-label]="showCurrentPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showCurrentPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showCurrentPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
          <div class="field-error" *ngIf="getFieldError('currentPassword')">
            {{ getFieldError('currentPassword') }}
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label for="newPassword" class="form-label">
            New Password
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              id="newPassword"
              [type]="showNewPassword ? 'text' : 'password'"
              formControlName="newPassword"
              class="form-control"
              [class.invalid]="isFieldInvalid('newPassword')"
              placeholder="Enter your new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password-btn"
              (click)="togglePasswordVisibility('new')"
              [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showNewPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showNewPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
          <div class="field-error" *ngIf="getFieldError('newPassword')">
            {{ getFieldError('newPassword') }}
          </div>

          <!-- Password Strength Meter -->
          <app-password-strength-meter
            [password]="getNewPasswordValue()"
            [showLabel]="true">
          </app-password-strength-meter>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">
            Confirm New Password
            <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword"
              class="form-control"
              [class.invalid]="isFieldInvalid('confirmPassword') || getFormError()"
              placeholder="Confirm your new password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password-btn"
              (click)="togglePasswordVisibility('confirm')"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showConfirmPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showConfirmPassword" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
          <div class="field-error" *ngIf="getFieldError('confirmPassword')">
            {{ getFieldError('confirmPassword') }}
          </div>
          <div class="field-error" *ngIf="getFormError()">
            {{ getFormError() }}
          </div>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="changePasswordForm.invalid || isSubmitting">
            <span *ngIf="!isSubmitting">Change Password</span>
            <span *ngIf="isSubmitting" class="loading-text">
              <span class="spinner"></span>
              Changing Password...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
