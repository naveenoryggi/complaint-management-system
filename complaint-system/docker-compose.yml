version: '3.8'

services:
  # PostgreSQL Database (Complaint System)
  postgres:
    image: postgres:15-alpine
    container_name: complaint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: complaint_user
      POSTGRES_PASSWORD: complaint_pass_dev
      POSTGRES_DB: complaint_management
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - complaint-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaint_user -d complaint_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: complaint-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - complaint-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: complaint-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: complaint_user
      DB_PASSWORD: complaint_pass_dev
      DB_DATABASE: complaint_management

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # JWT
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRY: 15m
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRY: 7d

      # Oryggi Connection (External - Not in Docker)
      ORYGGI_DB_HOST: host.docker.internal
      ORYGGI_DB_PORT: 1433
      ORYGGI_DB_USERNAME: sa
      ORYGGI_DB_PASSWORD: admin@123
      ORYGGI_DB_DATABASE: Oryggi
      ORYGGI_DB_TRUST_SERVER_CERTIFICATE: "true"

      # Frontend URL
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001

      # File Upload (Local)
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760

      # Email (Development - Console)
      EMAIL_SERVICE: console
      EMAIL_FROM: noreply@dev.local

      # Logging
      LOG_LEVEL: debug

    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    networks:
      - complaint-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: complaint-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Complaint Management System
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - complaint-network
    depends_on:
      - backend
    command: npm run dev

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: complaint-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@complaint.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - complaint-network
    depends_on:
      - postgres
    profiles:
      - tools

  # Redis Commander (Optional - Redis Management UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: complaint-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - complaint-network
    depends_on:
      - redis
    profiles:
      - tools

networks:
  complaint-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  pgadmin_data:
    driver: local
